# RETIRED — PyPI publishing under the upstream package name
#
# This file used to build the backend wheel on every version tag and publish it
# to the `openconstructionerp` project on PyPI via Trusted Publishing (OIDC)
# or the PYPI_API_TOKEN secret. That path is retired: publishing there put the
# upstream-named distribution on the public index and the in-app upgrade used
# to install it, which replaced this fork with upstream OpenConstructionERP.
#
# The replacement is `.github/workflows/release.yml`: on a version tag it builds
# the backend wheel plus SHA256SUMS.txt and attaches both to the GitHub release
# of Taha-Aalam/Vastukar. The upgrade path downloads that asset, verifies the
# checksum and installs it from the downloaded file. No PyPI token, environment
# or tag trigger remains here. The filename is kept because repository tests
# reference the path; nothing runs from it.

name: PyPI Publish (retired — use Release)

on:
  workflow_dispatch:
    inputs:
      notice:
        description: 'Read-only: this workflow no longer publishes anything.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  retired:
    name: Publishing to PyPI is retired
    runs-on: ubuntu-latest
    steps:
      - name: Point at the release workflow instead
        run: |
          echo "::notice::PyPI publishing is retired. The backend wheel and its checksum are attached to the GitHub release by .github/workflows/release.yml."
